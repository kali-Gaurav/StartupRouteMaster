[pytest]
# Pytest configuration for payment integration tests
# Team 5: QA & Testing Team

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode
asyncio_mode = auto

# Coverage options
addopts =
    --verbose
    --strict-markers
    -v
    --tb=short
    --disable-warnings

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for endpoints
    e2e: End-to-end tests for complete flows
    security: Security-focused tests
    performance: Performance and load tests
    payment: Payment-specific tests
    webhook: Webhook-specific tests
    asyncio: Async tests

# Test collection
python_paths = .

# Timeout for tests (in seconds)
timeout = 30

# Minimum Python version
minversion = 3.9

# Configure coverage
[coverage:run]
source = backend
omit =
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
