# Task 21: Exact Replica Docker Compose
# Use this to test the full production stack locally (Postgres + Redis + Backend)
version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: routemaster
      POSTGRES_PASSWORD: password
      POSTGRES_DB: routemaster_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://routemaster:password@db:5432/routemaster_prod
      - REDIS_URL=redis://redis:6379/0
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-prod_fallback_secret}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

volumes:
  postgres_prod_data:
