<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RouteMaster Razorpay Test</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #f8fafc; }
        .card { background: white; padding: 2rem; border-radius: 1rem; shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); border: 1px solid #e2e8f0; text-align: center; }
        button { background: #2563eb; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h1>RouteMaster Payment Test</h1>
        <p>This will test the integration with your local backend.</p>
        <button id="pay-button">Pay ₹1.00</button>
    </div>

    <script>
        document.getElementById('pay-button').onclick = async function() {
            const btn = this;
            btn.disabled = true;
            btn.innerText = "Creating Order...";

            try {
                // Step 1: Create order on your local backend
                const res = await fetch('http://localhost:8000/api/razorpay/create-order', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-Dev-Bypass': 'TRUE',
                        'Authorization': 'Bearer test-token'
                    },
                    body: JSON.stringify({
                        amount: 100, // 1 INR
                        currency: 'INR',
                        receipt: 'web_test_' + Date.now()
                    })
                });

                const order = await res.json();
                
                // Step 2: Open Razorpay Modal
                const options = {
                    key: 'rzp_test_Si7Rzwylj21i3C',
                    amount: order.amount,
                    currency: order.currency,
                    name: "RouteMaster Test",
                    order_id: order.order_id,
                    handler: async function (response) {
                        // Step 3: Verify on backend
                        const vRes = await fetch('http://localhost:8000/api/razorpay/verify-payment', {
                            method: 'POST',
                            headers: { 
                                'Content-Type': 'application/json',
                                'X-Dev-Bypass': 'TRUE',
                                'Authorization': 'Bearer test-token'
                            },
                            body: JSON.stringify({
                                payment_id: 'test_booking_id',
                                razorpay_payment_id: response.razorpay_payment_id,
                                razorpay_order_id: response.razorpay_order_id,
                                razorpay_signature: response.razorpay_signature
                            })
                        });
                        
                        const result = await vRes.json();
                        alert("🎉 PAYMENT SUCCESSFUL & VERIFIED!\n\n" + result.message);
                    }
                };
                const rzp = new Razorpay(options);
                rzp.open();
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Pay ₹1.00";
            }
        };
    </script>
</body>
</html>
