services:
  api_gateway:
    build:
      context: ../../
      dockerfile: backend/Dockerfile.prod
    container_name: routemaster_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - TELEGRAM_BOT_MODE=WEBHOOK
    volumes:
      - backend_logs:/app/logs
      - backend_data:/app/data
    networks:
      - routemaster_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ../../
      dockerfile: Dockerfile.frontend
      args:
        - VITE_RAILWAY_API_URL=${VITE_RAILWAY_API_URL}
    container_name: routemaster_frontend
    restart: unless-stopped
    networks:
      - routemaster_network
    depends_on:
      - api_gateway

  nginx:
    image: nginx:stable-alpine
    container_name: routemaster_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - routemaster_network
    depends_on:
      - api_gateway
      - frontend

  certbot:
    image: certbot/certbot
    container_name: routemaster_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  routemaster_network:
    driver: bridge

volumes:
  backend_logs:
  backend_data:
